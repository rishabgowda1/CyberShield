$kind: http-request
url: "{{baseUrl}}/api/network"
method: GET
headers:
  X-Client-Id: "{{clientId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test("All fields are strings", () => ["publicIp","clientIp","isp","asn","country","city","timezone"].forEach(k => pm.expect(r[k]).to.be.a("string")));
      pm.test("Live data loaded (partial = false)", () => pm.expect(r.partial).to.eql(false));
    language: text/javascript
order: 2000
