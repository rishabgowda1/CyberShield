$kind: http-request
url: "{{baseUrl}}/api/scan"
method: POST
headers:
  X-Client-Id: "{{clientId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "url": "example.com:22"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
      pm.test("Error code is PORT_BLOCKED", () => pm.expect(pm.response.json().error.code).to.eql("PORT_BLOCKED"));
    language: text/javascript
order: 4000
