$kind: http-request
url: "{{baseUrl}}/api/nope"
method: GET
headers:
  X-Client-Id: "{{clientId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
      pm.test("Error code is NOT_FOUND", () => pm.expect(pm.response.json().error.code).to.eql("NOT_FOUND"));
    language: text/javascript
order: 13000
