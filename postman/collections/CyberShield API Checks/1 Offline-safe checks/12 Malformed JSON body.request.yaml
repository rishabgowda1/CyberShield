$kind: http-request
url: "{{baseUrl}}/api/scan"
method: POST
headers:
  X-Client-Id: "{{clientId}}"
  Content-Type: application/json
body:
  type: json
  content: "{bad"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
      pm.test("Error code is BAD_JSON", () => pm.expect(pm.response.json().error.code).to.eql("BAD_JSON"));
    language: text/javascript
order: 12000
